[package]
name = "openlid-test-ft"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "OpenLid testnet-only NEP-141 test token (tUSDC, 6 decimals). Not for mainnet."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
